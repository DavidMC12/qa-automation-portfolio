name: iOS discovery (temporary)

# Dumps the real accessibility hierarchy of the app at several screens so the iOS
# flows can be written against it. Removed before the iOS PR is merged.
on:
  push:
    branches: [feat/mobile-ios]
    paths:
      - 'mobile/flows-ios/_discovery/**'
      - 'mobile/scripts/ios-discover.sh'
      - 'mobile/scripts/boot-ios-simulator.sh'
      - '.github/workflows/ios-discovery.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Download pinned demo app (simulator build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 2.3.0 -R saucelabs/my-demo-app-ios -p 'SauceLabs-Demo-App.Simulator.zip' -O ios-app.zip
          unzip -q ios-app.zip -d ios-app

      - name: Boot simulator and install the app
        run: bash mobile/scripts/boot-ios-simulator.sh "ios-app/Payload/My Demo App.app"

      - name: Discover screens
        run: bash mobile/scripts/ios-discover.sh

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-discovery
          path: mobile/artifacts/ios/discovery
          retention-days: 7
