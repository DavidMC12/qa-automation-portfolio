name: Mobile tests

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-tests.yml'
  workflow_call:

env:
  APK_RELEASE_TAG: '2.2.0'
  APK_ASSET_PATTERN: 'mda-2.2.0-*.apk'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mobile workspace dependencies
        run: npm ci

      - name: Run gallery generator unit tests
        working-directory: mobile
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install xvfb (required by `maestro record --local`)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Maestro CLI
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash

      - name: Download pinned demo app APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$APK_RELEASE_TAG" -R saucelabs/my-demo-app-android -p "$APK_ASSET_PATTERN" -O app.apk

      - name: Run Maestro flows and record evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r app.apk
            mkdir -p mobile/artifacts/videos

            "$HOME/.maestro/bin/maestro" test mobile/flows --format=JUNIT --output=mobile/artifacts/report.xml || true

            find mobile/flows -name '*.yaml' ! -name 'config.yaml' | while read -r flow; do
              name=$(basename "$flow" .yaml)
              xvfb-run -a "$HOME/.maestro/bin/maestro" record "$flow" "mobile/artifacts/videos/$name.mp4" --local || true
            done

      - name: Generate evidence gallery
        working-directory: mobile
        run: node scripts/generate-gallery.mjs artifacts/report.xml artifacts/videos artifacts/gallery

      - name: Upload mobile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-report
          path: mobile/artifacts/gallery
          retention-days: 30

      - name: Fail job if any flow failed
        run: |
          if grep -q '<failure' mobile/artifacts/report.xml; then
            echo "One or more Maestro flows failed — see the uploaded gallery for evidence."
            exit 1
          fi
