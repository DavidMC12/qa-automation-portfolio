name: Deploy reports to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  web:
    uses: ./.github/workflows/web-tests.yml

  mobile:
    uses: ./.github/workflows/mobile-tests.yml

  publish:
    needs: [web, mobile]
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-report
          path: _site/web

      - uses: actions/download-artifact@v4
        with:
          name: mobile-report
          path: _site/mobile

      - name: Assemble Pages index
        run: cp docs/pages-index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
