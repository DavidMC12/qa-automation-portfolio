name: CI

on:
  push:
    branches: [main]
  # The targets are third-party apps that can change without a commit here, so
  # the suites also run weekly: the README badge then reflects today's state,
  # not just the last push.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  web:
    uses: ./.github/workflows/web-tests.yml

  mobile:
    uses: ./.github/workflows/mobile-tests.yml

  mobile-ios:
    uses: ./.github/workflows/mobile-ios-tests.yml

  publish:
    needs: [web, mobile, mobile-ios]
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: web-report
          path: _site/web

      - uses: actions/download-artifact@v7
        with:
          name: mobile-report
          path: _site/mobile

      - uses: actions/download-artifact@v7
        with:
          name: mobile-ios-report
          path: _site/mobile-ios

      - name: Assemble Pages index
        run: cp docs/pages-index.html _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - uses: actions/deploy-pages@v5
        id: deployment
