name: Update visual baselines

# Screenshot baselines are only valid for the OS and browser build that produced
# them, so they are regenerated here (ubuntu-latest, same as the test runs) rather
# than on a developer machine. Run it from the Actions tab on the branch whose
# baselines need refreshing; it commits the result back to that branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # One worker, in file order: the visual_user test reads the baseline that
      # the standard_user test writes, so they must not race on a clean slate.
      - name: Regenerate baselines
        working-directory: web
        run: npx playwright test --project=visual --update-snapshots --workers=1

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/tests/visual
          if git diff --cached --quiet; then
            echo "Baselines already up to date."
            exit 0
          fi
          git commit -m "Update visual regression baselines"
          git push
