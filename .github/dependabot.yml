# Keeps the pinned GitHub Actions and npm packages current. Grouped and weekly so
# it opens one PR per ecosystem instead of one per package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Major bumps (TypeScript, @types/node, ...) are taken deliberately, together
    # with the CI Node version, not as part of a weekly group.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']
