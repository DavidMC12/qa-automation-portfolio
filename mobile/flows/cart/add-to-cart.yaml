# "Add to cart" adds the item and stays on the detail screen, so we go `back` to the
# catalog and open the cart from the header ("View cart" content-description).
appId: com.saucelabs.mydemoapp.android
---
- launchApp:
    clearState: true
- tapOn: "Sauce Labs Backpack"
- scrollUntilVisible:
    element:
      text: "Add to cart"
    direction: DOWN
- tapOn: "Add to cart"
- back
- tapOn: "View cart"
- assertVisible: "Sauce Labs Backpack"
