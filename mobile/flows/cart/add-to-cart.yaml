# Tap the product IMAGE (the only clickable view in the catalog card), add the
# item, then open the cart from the header ("View cart" content-description).
appId: com.saucelabs.mydemoapp.android
---
- runFlow: ../_shared/open-app.yaml
- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/productIV"
    index: 0
- scrollUntilVisible:
    element:
      text: "Add to cart"
    direction: DOWN
- tapOn: "Add to cart"
- back
- tapOn: "View cart"
- assertVisible: "Sauce Labs Backpack"
