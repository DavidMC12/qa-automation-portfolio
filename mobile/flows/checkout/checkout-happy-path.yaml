# Checkout is 3 screens (verified against the fragments' Java + layout XML at tag 2.2.0):
#   1. CheckoutInfoFragment (shipping address) -> "To Payment"   (button is inside the scroll view)
#   2. CheckoutFragment (card details)         -> "Review Order" (sticky button, always visible)
#   3. PlaceOrderFragment (review)             -> "Place Order"  (sticky button, always visible)
# The "billing address is the same as shipping" checkbox is checked by default, so the
# billing fields stay hidden and must NOT be filled.
appId: com.saucelabs.mydemoapp.android
---
- runFlow: ../login/valid-login.yaml
- tapOn: "Sauce Labs Backpack"
- scrollUntilVisible:
    element:
      text: "Add to cart"
    direction: DOWN
- tapOn: "Add to cart"
- back
- tapOn: "View cart"
- tapOn: "Proceed To Checkout"

# 1. Shipping address
- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/fullNameET"
- inputText: "John Doe"
- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/address1ET"
- inputText: "123 Main St"
- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/cityET"
- inputText: "San Francisco"
- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/zipET"
- inputText: "94105"
- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/countryET"
- inputText: "USA"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "To Payment"
    direction: DOWN
- tapOn: "To Payment"

# 2. Card details
- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/nameET"
- inputText: "John Doe"
- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/cardNumberET"
- inputText: "4111111111111111"
- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/expirationDateET"
- inputText: "12/28"
- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/securityCodeET"
- inputText: "123"
- hideKeyboard
- tapOn: "Review Order"

# 3. Review
- tapOn: "Place Order"
- assertVisible: "Thank you for your order"
