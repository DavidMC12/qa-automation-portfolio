# Checkout is 3 screens (verified against the fragments' Java + layout XML at tag 2.2.0):
#   1. CheckoutInfoFragment (shipping address) -> "To Payment"   (button is inside the scroll view)
#   2. CheckoutFragment (card details)         -> "Review Order" (sticky button, always visible)
#   3. PlaceOrderFragment (review)             -> "Place Order"  (sticky button, always visible)
# Logging in first means the cart goes straight to checkout instead of detouring
# through the login screen (see CartFragment: it branches on ST.isLogin).
# The "billing address is the same as shipping" checkbox ships checked, so the
# billing fields stay hidden and must NOT be filled — note that fragment_checkout.xml
# reuses the ids fullNameET/address1ET/cityET/zipET/countryET for that hidden
# section, which is why the card screen is filled by its own nameET/card* ids.
# Required fields are the ones CheckoutInfoFragment.validate() checks: full name,
# address line 1, city, zip and country; address 2 and state are optional.
# Every field goes through _shared/fill-field.yaml, which scrolls it into view,
# types, and only THEN dismisses the keyboard. That order is load-bearing — see
# that file for why. Without it the fields below the fold are unreachable, because
# the keyboard both hides them and swallows the scroll gesture.
appId: com.saucelabs.mydemoapp.android
---
- runFlow: ../login/valid-login.yaml
- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/productIV"
    index: 0
- scrollUntilVisible:
    element:
      text: "Add to cart"
    direction: DOWN
- tapOn: "Add to cart"
- back
- tapOn: "View cart"
- tapOn: "Proceed To Checkout"

# 1. Shipping address
- assertVisible: "Enter a shipping address"
- runFlow:
    file: ../_shared/fill-field.yaml
    env:
      FIELD_ID: "com.saucelabs.mydemoapp.android:id/fullNameET"
      VALUE: "John Doe"
- runFlow:
    file: ../_shared/fill-field.yaml
    env:
      FIELD_ID: "com.saucelabs.mydemoapp.android:id/address1ET"
      VALUE: "123 Main St"
- runFlow:
    file: ../_shared/fill-field.yaml
    env:
      FIELD_ID: "com.saucelabs.mydemoapp.android:id/cityET"
      VALUE: "San Francisco"
- runFlow:
    file: ../_shared/fill-field.yaml
    env:
      FIELD_ID: "com.saucelabs.mydemoapp.android:id/zipET"
      VALUE: "94105"
- runFlow:
    file: ../_shared/fill-field.yaml
    env:
      FIELD_ID: "com.saucelabs.mydemoapp.android:id/countryET"
      VALUE: "USA"
- scrollUntilVisible:
    element:
      text: "To Payment"
    direction: DOWN
- tapOn: "To Payment"

# 2. Card details
- assertVisible: "Enter a payment method"
- runFlow:
    file: ../_shared/fill-field.yaml
    env:
      FIELD_ID: "com.saucelabs.mydemoapp.android:id/nameET"
      VALUE: "John Doe"
- runFlow:
    file: ../_shared/fill-field.yaml
    env:
      FIELD_ID: "com.saucelabs.mydemoapp.android:id/cardNumberET"
      VALUE: "4111111111111111"
- runFlow:
    file: ../_shared/fill-field.yaml
    env:
      FIELD_ID: "com.saucelabs.mydemoapp.android:id/expirationDateET"
      VALUE: "12/28"
- runFlow:
    file: ../_shared/fill-field.yaml
    env:
      FIELD_ID: "com.saucelabs.mydemoapp.android:id/securityCodeET"
      VALUE: "123"
- tapOn: "Review Order"

# 3. Review
- assertVisible: "Review your order"
- tapOn: "Place Order"
- assertVisible: "Thank you for your order"
