# Fills one text field of the checkout forms. Not a test on its own — the leading
# underscore keeps `record-flows.sh` from running it as a standalone flow.
#
# Every checkout screen is one long NestedScrollView, so a field further down the
# form is simply not on screen, and the soft keyboard opened by the previous field
# hides whatever is left. Both are handled here rather than at each call site:
# dismiss the keyboard first, so the form is at its full height and the field sits
# where it appears, then scroll it fully into view, tap, type, and dismiss again.
#
# Deliberately no `centerElement: true`: Orchestra only ever swipes in the given
# direction, so for a field already above the centre (fullNameET, at the top of the
# form) scrolling DOWN pushes it off screen instead of centring it, and the command
# fails with "No visible element found" on a field that was visible to begin with.
#
# env: FIELD_ID — fully qualified resource id, VALUE — text to type.
appId: com.saucelabs.mydemoapp.android
---
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "${FIELD_ID}"
    direction: DOWN
- tapOn:
    id: "${FIELD_ID}"
- inputText: "${VALUE}"
- hideKeyboard
