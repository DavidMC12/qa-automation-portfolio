# Fills one text field of the checkout forms. Not a test on its own — the leading
# underscore keeps `record-flows.sh` from running it as a standalone flow.
#
# Every checkout screen is one long NestedScrollView, so a field further down the
# form is simply off screen, and Maestro only matches what is actually on screen —
# that is the whole reason a plain `tapOn` on cityET reported "Element not found".
# Scrolling the field into view first is the fix.
#
# Deliberately NO `hideKeyboard` here. On Android that command is implemented as
# `input keyevent 4` — a real BACK press that happens to dismiss the keyboard as a
# side effect. With no keyboard up it is just Back, so calling it on arrival at the
# shipping form navigated to the cart and every field then reported "No visible
# element found". Nothing here needs it: `scrollUntilVisible` scrolls the form
# whether or not a keyboard is showing.
#
# Deliberately no `centerElement: true` either — Orchestra only swipes in the given
# direction, so for a field already above the centre it scrolls DOWN, away from the
# target, instead of centring it.
#
# env: FIELD_ID — fully qualified resource id, VALUE — text to type.
appId: com.saucelabs.mydemoapp.android
---
- scrollUntilVisible:
    element:
      id: "${FIELD_ID}"
    direction: DOWN
- tapOn:
    id: "${FIELD_ID}"
- inputText: "${VALUE}"
