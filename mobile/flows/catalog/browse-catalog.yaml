# The catalog is the app's default screen — no login needed to browse.
# Assert the first product BEFORE scrolling: a blind `scroll` moves it off screen.
# Product names come from BaseActivity.java (the Room seed data).
appId: com.saucelabs.mydemoapp.android
---
- runFlow: ../_shared/open-app.yaml
- assertVisible: "Products"
- assertVisible: "Sauce Labs Backpack"
- scrollUntilVisible:
    element:
      text: "Sauce Labs Bike Light"
    direction: DOWN
- assertVisible: "Sauce Labs Bike Light"
