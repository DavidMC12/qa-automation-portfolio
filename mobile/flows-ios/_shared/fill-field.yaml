# Fills one text field of the checkout forms. Not a test on its own — the leading
# underscore keeps record-flows-ios.sh from running it as a standalone flow.
#
# iOS exposes a text field's PLACEHOLDER as its hint text and nothing else (the
# field has no identifier and no label), so the placeholder is the only handle
# there is: FIELD is that placeholder, e.g. "Rebecca Winter" for the full name.
#
# The keyboard has to go away after every field. It covers the lower half of the
# form, and Maestro taps at an element's coordinates whether or not it is covered:
# without this, tapping the next placeholder landed on a key instead, and a single
# address line ended up as "123 Main St San Franciscod94105jUSAv". Unlike Android,
# hideKeyboard here is a real dismissal, not a Back press, so it is safe.
#
# env: FIELD — the field's placeholder text, VALUE — text to type.
appId: com.saucelabs.mydemo.app.ios
---
- tapOn: "${FIELD}"
- inputText: "${VALUE}"
- hideKeyboard
