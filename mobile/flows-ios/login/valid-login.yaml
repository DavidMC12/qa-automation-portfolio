# The app opens on the catalog; login lives behind the More tab. The menu entry
# reads "Login" while logged out and "Log Out" afterwards, but neither string is
# exposed to accessibility — the entry is only reachable by its identifier,
# "LogOut-menu-item", in both states. The logged-in state therefore can't be read
# from the menu, so it is asserted by behaviour: the login form is gone, and the
# same entry sends us back to it.
# Tapping a listed username fills both fields (the password is always 10203040).
# NOTE: unlike the Android app, iOS never validates credentials, so there is no
# locked-out account to test — see missing-username.yaml for the negative path.
appId: com.saucelabs.mydemo.app.ios
---
- runFlow: ../_shared/open-app.yaml
- tapOn:
    id: "More-tab-item"
- tapOn:
    id: "LogOut-menu-item"
- tapOn: "bob@example.com"
# The login screen has three elements named "Login" in tree order: the page
# header, the green button, and the button's own label. Index 1 is the button.
- tapOn:
    text: "Login"
    index: 1
- extendedWaitUntil:
    visible:
      id: "Catalog-screen"
    timeout: 20000
- assertNotVisible: "Select a username from the list below"

# Logged in, the same menu entry logs out and returns to the login form.
- tapOn:
    id: "More-tab-item"
- tapOn:
    id: "LogOut-menu-item"
- assertVisible: "Select a username from the list below"
